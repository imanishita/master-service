server:
  port: 8080

  servlet:
    context-path: /api/v1/masters

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/Harmonique?currentSchema=userauth
    username: postgres
    password: 
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none       
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true          
    format-sql: true

  jackson:
    time-zone: UTC

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql.BasicBinder: trace
